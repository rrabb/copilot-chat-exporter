# Opt-in CI for this standalone repository. GitHub only reads `.github/workflows/`,
# so this template is inactive until copied there.
#
# To enable:
#
#   cp ci/github-workflow.yml .github/workflows/verify.yml
#
# It runs only what a fresh clone can run. The live-session baseline is excluded on purpose: that
# fixture is a ~30 MB verbatim copy of a real session, gitignored and machine-local.

name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Both platforms, because the recorded checks compare bytes and had only ever been produced on
    # Windows. Paths and line endings are the two things that would diverge, and this is what
    # proves they do not.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.18 is the floor: the release where running .ts directly stopped needing a flag.
        node: ['22.18', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack --dry-run
      - run: pnpm run verify
