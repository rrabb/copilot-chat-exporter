# Optional example for a standalone GitLab mirror, not the current GitHub host.
# Include this file from a root `.gitlab-ci.yml` to enable it.
#
# It runs only what a fresh clone can run: both type checks, unit tests, the committed golden
# fixture, the distribution build, and a package dry run. The live-session baseline is excluded.

copilot_chat_exporter_verify:
  stage: test
  image: node:24.18.0
  before_script:
    - corepack enable
    - corepack install
  script:
    - node --version
    - pnpm install --frozen-lockfile
    - pnpm pack --dry-run
    - pnpm run verify
